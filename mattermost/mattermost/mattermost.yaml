apiVersion: installation.mattermost.com/v1beta1
kind: Mattermost
metadata:
  name: mattermost
spec:
  version: 11.9.0
  replicas: 1
  ingress:
    enabled: true
    host: mattermost.westsidestreet.net
    annotations:
      kubernetes.io/ingress.class: nginx
  database:
    external:
      secret: mattermost-pg-connection
    readinessCheck:
      mode: builtin
  fileStore:
    external:
      url: mattermost--rustfs-svc:9000
      bucket: file-store
      secret: mattermost-file-store--s3
