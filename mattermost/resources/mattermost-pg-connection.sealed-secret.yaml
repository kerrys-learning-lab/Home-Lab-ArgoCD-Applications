# --------------------------------------------------------------------------
# Database credentials for the Mattermost CNPG cluster.
# To generate:
#   sealed-secret.sh encrypt --context mattermost-11  mattermost  mattermost-pg-connection
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: mattermost-pg-connection
spec:
  template:
    type: Opaque
  encryptedData:
    DB_CONNECTION_STRING: 
