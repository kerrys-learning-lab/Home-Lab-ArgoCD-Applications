# --------------------------------------------------------------------------
# RuseFS credentials for the GitLab object store.
# To generate:
#   sealed-secret.sh encrypt --context mattermost-11  mattermost  rustfs--keys
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: rustfs--keys
spec:
  template:
    type: Opaque
  encryptedData:
    # mmuser
    RUSTFS_ACCESS_KEY: 
    # nTub...
    RUSTFS_SECRET_KEY: 
