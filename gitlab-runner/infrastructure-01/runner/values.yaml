gitlabUrl: https://gitlab.westsidestreet.net
runners:
  name: infrastructure-01
  config: |
    [[runners]]
      request_concurrency = 10

      [runners.feature_flags]
        FF_ENABLE_BASH_EXIT_CODE_CHECK = true
        FF_SCRIPT_SECTIONS = true
        FF_TIMESTAMPS = true
        FF_USE_ADAPTIVE_REQUEST_CONCURRENCY = true

      [runners.kubernetes]
        privileged = true
        allowed_pull_policies = ["always", "if-not-present"]
        pull_policy = "if-not-present"

      [runners.cache]
        Type = "s3"
        Shared = true

        [runners.cache.s3]
          ServerAddress = "gitlab--rustfs-svc"
          BucketName = "gitlab-runner-cache"
          BucketLocation = "us-east-1"
          Insecure = true
          AuthenticationType = "access-key"
  cache:
    secretName: runner-cache--s3
  secret: runner--token
concurrent: 5
replicas: 4
rbac:
  create: true
