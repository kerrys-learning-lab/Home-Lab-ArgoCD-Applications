      #
      # Endpoint:     http://nas.westsidestreet.net:9000
      # Bucket name:  machine-learning
      # Access key:   w5BPQdGhGVJdMrnE49sT
      s3endpoint: 
      s3bucketname: 
      s3accesskeyid: 
      s3accesskey: 
  open-webui-db-credentials:
    # sealed-secret.sh  encrypt --context  nvidia-5080  home-lab-local-inference  open-webui-db-credentials
    #
    # Username: open-webui
    type: Opaque
    encryptedData:
      username: 
      password: 

certificates:
  llm-tls:
    secretName: llm-tls
    dnsNames:
      - llm.westsidestreet.net
    issuerRef:
      name: acme-letsencrypt-cluster-issuer
      kind: ClusterIssuer

resources:
  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: strip-vllm-prefix
    spec:
      stripPrefix:
        prefixes:
          - /vllm

  - apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: llm-api-ingress
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
        traefik.ingress.kubernetes.io/router.middlewares: llm-strip-vllm-prefix@kubernetescrd
    spec:
      ingressClassName: traefik
      tls:
        - hosts:
            - llm.westsidestreet.net
          secretName: llm-tls
      rules:
        - host: llm.westsidestreet.net
          http:
            paths:
              - path: /vllm
                pathType: Prefix
                backend:
                  service:
                    name: home-lab-local-inference--vllm-service
                    port:
                      name: service-port

  - apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: llm-ui-ingress
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
    spec:
      ingressClassName: traefik
      tls:
        - hosts:
            - llm.westsidestreet.net
          secretName: llm-tls
      rules:
        - host: llm.westsidestreet.net
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: home-lab-local-inference--open-webui
                    port:
                      number: 80

cnpg:
  open-webui-db:
    instances: 1
    storage:
      size: 10Gi
    bootstrap:
      initdb:
        database: open-webui
        owner: open-webui
        secret:
          name: open-webui-db-credentials
    postgresql:
      parameters:
        shared_buffers: "128MB"
    monitoring:
      enablePodMonitor: false
