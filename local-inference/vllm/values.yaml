image:
  repository: nvcr.io/nvidia/vllm
  tag: 26.04-py3
  env:
    - name: VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS
      value: "1"
  command:
    # https://docs.vllm.ai/en/stable/cli/serve/#vllm-serve

    - vllm
    - serve
    - /data/

    # Frontend config
    - --host
    - 0.0.0.0
    - --port
    - "8000"

    # Model config:
    - --dtype
    - half
    - --max-model-len
    - "32768"
    - --served-model-name
    - active-model

    # Cache config:
    - --gpu-memory-utilization
    - "0.999"
    # The following setting will not be available until vLLM 0.21.0 is
    # incoporated into NVIDIA's image (current vLLM for 26.04 is 0.19.0)
    # - --kv-cache-dtype
    # - turboquant_4bit_nc
    #
    # So, for now...
    - --kv-cache-dtype
    - fp8


deploymentStrategy:
  type: Recreate


resources:
  requests:
    cpu: 4
    memory: 24Gi
    nvidia.com/gpu: 1
  limits:
    cpu: 4
    memory: 24Gi
    nvidia.com/gpu: 1

livenessProbe:
  # -- Number of seconds after the container has started before liveness probe
  #    is initiated
  initialDelaySeconds: 300


extraInit:
  pvcStorage: 50Gi
  awsEc2MetadataDisabled: true
  s3modelpath: models/Qwen2.5-Coder-14B-Instruct-AWQ
  modelDownload:
    # Default image (2.6.4) DOES NOT WORK
    image:
      repository: "amazon/aws-cli"
      tag: 2.34.4

gpuModels:
  - NVIDIA-GeForce-RTX-5080

extraContainers:
  - name: bash-sidecar
    image: docker.io/ubuntu:resolute-20260108
    command:
      - /bin/bash
      - -c
    args:
      - while true; do sleep 3000; done
    volumeMounts:
      - name: home-lab-local-inference--vllm-storage
        mountPath: /data

# S3 credentials are provided via a SealedSecret named "home-lab-local-inference-secrets"
# (deployed by the resources app), matching the chart's expected
# secret name pattern: {{ .Release.Name }}-secrets
