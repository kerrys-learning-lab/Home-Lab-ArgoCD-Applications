# ============================================================================
# NOTE: Starting with GitLab 19 (this release):
#         - Ingress is deprecated in favor of Gateway API (using Envoy)
#         - An external Postgres 17 database is required, with the following
#           extensions:
#             - amcheck
#             - btree_gist
#             - pg_trgm
#         - An external Redis is required
# ----------------------------------------------------------------------------
global:
  hosts:
    domain: westsidestreet.net
  gatewayApi:
    configureCertmanager: false
  kas:
    enabled: true
    minReplicas: 2 # Default: 2
    maxReplicas: 4 # Default: 10
  pages:
    enabled: true
  psql:
    host: gitlab-pg-rw
    password:
      useSecret: true
      secret: production-db--basic-auth
      key: password
  redis:
    host: redis
    auth:
      enabled: false
  shell:
    replicaCount: 1
  appConfig:
    object_store:
      enabled: true
      connection:
        secret: rails-storage--s3
# Ref: https://docs.gitlab.com/charts/charts/gitlab/
gitlab:
  # Ref: https://docs.gitlab.com/charts/charts/gitlab/gitaly/
  gitaly:
    persistence:
      storageClass: local-path
      size: 50Gi
  sidekiq:
    # NOTE: Trying to reduce the number of open connections to PG due to
    #       constantly reaching max:
    minReplicas: 2
    maxReplicas: 4
    concurrency: 5
  toolbox:
    backups:
      objectStorage:
        config:
          secret: external-backup--s3cfg
      cron:
        enabled: true
        schedule: "@weekly"
registry:
  enabled: true
  storage:
    secret: registry-storage--s3
    redirect:
      disable: true
  database:
    enabled: true
    name: registry
    user: registry
    password:
      secret: registry-metadata-db--basic-auth
      key: password
    migrations:
      enabled: true
  hpa:
    minReplicas: 4
    maxReplicas: 10
gitlab-runner:
  # Disabled because we deploy a privileged runner via separate
  # ArgoCD Application
  install: false
# Temporarily disabling for ArgoCD deployment
upgradeCheck:
  enabled: false
