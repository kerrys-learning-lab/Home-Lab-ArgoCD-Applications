# ============================================================================
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: gitlab
spec:
  instances: 1
  imageName: registry.westsidestreet.net/home-lab/gitlab-postgresql:17.10.0-gitlab-19-x
  bootstrap:
    initdb:
      database: production
      owner: gitlab
      secret:
        name: production-db--basic-auth
  storage:
    size: 10Gi
    pvcTemplate:
      storageClassName: cnpg-local-path
  # Performs the equivalent of 'CREATE USER ...' as required here:
  # https://docs.gitlab.com/charts/charts/registry/metadata_database/
  managed:
    roles:
      - name: registry
        ensure: present
        login: true
        passwordSecret:
          name: registry-metadata-db--basic-auth
---
# ============================================================================
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: production-db
spec:
  name: production
  owner: gitlab
  cluster:
    name: gitlab
  extensions:
    # GitLab requires these extensions, all of which are part of the custom
    # image used above:
    #   - amcheck
    #   - btree_gist
    #   - pg_trgm
    # Ref: https://docs.gitlab.com/charts/advanced/external-db/
    - name: amcheck
    - name: btree_gist
    - name: pg_trgm
---
# ============================================================================
# Performs the equivalent of 'CREATE DATABASE ...' as required here:
# https://docs.gitlab.com/charts/charts/registry/metadata_database/
#
# (no extensions required)
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: registry-metadata-db
spec:
  name: registry
  owner: registry
  cluster:
    name: gitlab
  databaseReclaimPolicy: retain
