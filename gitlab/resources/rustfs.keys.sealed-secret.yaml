# --------------------------------------------------------------------------
# RuseFS credentials for the GitLab object store.
# To generate:
#   sealed-secret.sh encrypt --context gitlab-19  gitlab  rustfs--keys
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: rustfs--keys
spec:
  type: Opaque
  encryptedData:
    # gitlab
    RUSTFS_ACCESS_KEY: 
    # q81w...
    RUSTFS_SECRET_KEY: 
